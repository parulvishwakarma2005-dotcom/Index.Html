<form action="#" method="post" enctype="multipart/form-data">

<h2>Application Form</h2>
<a href="apply.html">Apply Now</a>
<label>First Name</label><br>
<input type="text" name="firstname" required><br><br>

<label>Last Name</label><br>
<input type="text" name="lastname" required><br><br>

<label>Father's Name</label><br>
<input type="text" name="fathername" required><br><br>

<label>Mother's Name</label><br>
<input type="text" name="mothername"><br><br>

<label>Date of Birth</label><br>
<input type="date" name="dob" required><br><br>

<label>Gender</label><br>
<input type="radio" name="gender" value="Male"> Male
<input type="radio" name="gender" value="Female"> Female
<input type="radio" name="gender" value="Other"> Other
<br><br>

<label>Category</label><br>
<select name="category">
<option>General</option>
<option>OBC</option>
<option>SC</option>
<option>ST</option>
<option>EWS</option>
</select>
<br><br>

<label>Mobile Number</label><br>
<input type="tel" name="mobile" maxlength="10" required><br><br>

<label>Email Address</label><br>
<input type="email" name="email"><br><br>

<label>Aadhaar Number</label><br>
<input type="text" name="aadhaar" maxlength="12"><br><br>

<label>Address</label><br>
<textarea name="address" rows="4"></textarea><br><br>

<label>State</label><br>
<input type="text" name="state"><br><br>

<label>District</label><br>
<input type="text" name="district"><br><br>

<label>City</label><br>
<input type="text" name="city"><br><br>

<label>PIN Code</label><br>
<input type="text" name="pincode"><br><br>

<label>Qualification</label><br>
<input type="text" name="qualification"><br><br>

<label>Course / Post Applied For</label><br>
<input type="text" name="course"><br><br>

<label>Upload Photo</label><br>
<input type="file" name="photo"><br><br>

<label>Upload Signature</label><br>
<input type="file" name="signature"><br><br>

<label>Upload Aadhaar Card</label><br>
<input type="file" name="aadhaarfile"><br><br>

<label>Upload Marksheet / Certificate</label><br>
<input type="file" name="marksheet"><br><br>

<input type="checkbox" required>
I declare that all the information provided by me is true.
<br><br>

<input type="submit" value="Submit Application">
<input type="reset" value="Reset">

</form>
