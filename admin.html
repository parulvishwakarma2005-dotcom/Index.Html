<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Parul Online Portal</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

.container{
    width:90%;
    max-width:400px;
    margin:40px auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#004080;
}

h2{
    text-align:center;
    color:#333;
}

label{
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0 15px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    text-decoration:none;
    font-weight:bold;
    color:#004080;
}
</style>

</head>
<body>

<div class="container">

<h1>Parul Online Portal</h1>
<h2>Admin Login</h2>

<form>

<label>Admin ID</label>
<input type="text" placeholder="Enter Admin ID" required>

<label>Password</label>
<input type="password" placeholder="Enter Password" required>

<button type="submit">Login</button>

</form>

<a href="index.html" class="back">⬅ Back to Home</a>

</div>

</body>
</html>
