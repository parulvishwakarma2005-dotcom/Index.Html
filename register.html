 <!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>पंजीकरण</title>

<link rel="stylesheet" href="style.css">

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
}
.container{
width:90%;
max-width:400px;
margin:40px auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{
text-align:center;
color:#004080;
}
input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}
button{
width:100%;
padding:12px;
background:#007bff;
color:white;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
}
button:hover{
background:#0056b3;
}
a{
text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<h2>नया पंजीकरण</h2>

<form>

<input type="text" placeholder="पूरा नाम" required>

<input type="email" placeholder="ईमेल" required>

<input type="password" placeholder="पासवर्ड" required>

<button type="submit">पंजीकरण करें</button>

</form>

<br>

<a href="login.html">
<button type="button">लॉगिन करें</button>
</a>

</div>

</body>
</html>
